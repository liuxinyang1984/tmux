set -g mouse on
set -g default-terminal "tmux-256color"
# st 的 fix-keyboard-input 以 CSI u 发送组合键（如 M-S-Enter）
# always：agent 多用 kitty 键盘协议请求扩展键，tmux 不认，设为 on 时 S-Enter 会退化成普通回车
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'st*:extkeys'

# 1. 解除默认的 prefix 绑定（可选）
unbind C-b
set -g prefix M-Space

# 1. Alt + Enter 垂直切分面板（左右分割）
bind -n M-Enter split-window -h

# 2. Alt + Shift + Enter 水平切分面板（上下分割）
bind -n M-S-Enter split-window -v

# 3. 使用 Alt + h/j/k/l 直接切换面板（无需 prefix）
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+Shift+字母：传统编码到达为 M-H，开启 extended-keys 后到达为 M-S-h / M-S-H，三者在 tmux 里是不同的键
bind -n M-H resize-pane -L 5
bind -n M-S-h resize-pane -L 5
bind -n M-S-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-S-j resize-pane -D 5
bind -n M-S-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-S-k resize-pane -U 5
bind -n M-S-K resize-pane -U 5
bind -n M-L resize-pane -R 5
bind -n M-S-l resize-pane -R 5
bind -n M-S-L resize-pane -R 5

# 4. Alt + Shift + n 新建窗口；Alt + , / . 切换窗口焦点
bind -n M-N new-window
bind -n M-S-n new-window
bind -n M-S-N new-window
bind -n M-, previous-window
bind -n M-. next-window

# Alt + 1..9 直接切到对应窗口（SSH 下可用默认的 prefix + 数字）
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# 5. Alt + v 直接进入 copy-mode（不要用 M-[，会和 ESC [ 转义序列冲突）
bind -n M-v copy-mode

# copy-mode 用 vi 键位：v 开始选择，C-v 矩形选择，y 复制并退出
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# 鼠标拖选松手后不退出，可继续用键盘翻页扩展选区，再按 y 复制
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# 6. 关闭 / 离开（与 dwm 语义对齐：q 关内容，Shift+e 保留会话离开）
# Alt+q 关 pane；Alt+Shift+q 关窗口；Alt+Shift+e detach（kiosk 下会关 X，会话仍在）
bind -n M-q kill-pane
bind -n M-Q kill-window
bind -n M-S-q kill-window
bind -n M-S-Q kill-window
bind -n M-E detach-client
bind -n M-S-e detach-client
bind -n M-S-E detach-client

# 4b. 备用：prefix (Alt+Space) 后 —— SSH 等 Alt 失效时用
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind , previous-window
bind . next-window
bind N new-window
bind q kill-pane
bind Q kill-window
bind E detach-client

## Plugin ##
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# 主题（官方网站预览效果）
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'basic'
# 窗口标签显示当前命令（#W），而不是主机名 pane 标题（#T）
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# 右侧 status 模块：去掉左侧 █（会显得左边过宽），保留右侧 █
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "no"

# 自定义图标（须在 catppuccin.tmux 加载前设置）
# 两侧各一个 thin space（U+2009）；更窄的空格在终端里仍偏宽，不再追加
set -g @catppuccin_application_icon " 󰘵 " # 当前标题/命令
set -g @catppuccin_date_time_icon "  "   # 日期
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M:%S"
# battery：#{l:...} 延迟展开，等 TPM/tmux-battery 再插值为 #(.script)
# 插电用 status 图标，未插电用电量档位图标（见 @batt_icon_*）
set -g @batt_icon_status_charging " 󰂄 "
set -g @batt_icon_status_charged " 󰚥 "
set -g @batt_icon_status_discharging " 󰂃 "
set -g @catppuccin_battery_icon "#{l:#{battery_icon}}"
# Linux 走 sysfs 时 percentage 无 % 后缀，这里补上
set -g @catppuccin_battery_text " #{l:#{battery_percentage}}%"
# prefix 状态改绑到 fcitx 键盘模块，不再显示 session

# 设置 TPM 插件的安装目录（指向 ~/.config/tmux/plugins）
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# 先加载 catppuccin，再设置 status（官方推荐顺序）
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-interval 1
set -g status-right-length 120
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
# 有电池才显示（无 /sys/.../BAT* 的台式机跳过）
if-shell 'ls /sys/class/power_supply/BAT* >/dev/null 2>&1' {
	set -agF status-right "#{E:@catppuccin_status_battery}"
}
# fcitx5：键盘图标 + 输入法；按住 prefix 变红；放在最右侧
set -g @fcitx_im ' En'
source -F "#{d:current_file}/fcitx.conf"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_fcitx}"
run-shell -b "#{d:current_file}/fcitx-watch.sh"

# 初始化 TPM（必须放在配置文件最底部）
run '~/.config/tmux/plugins/tpm/tpm'
