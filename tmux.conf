set -g mouse on
set -g default-terminal "tmux-256color"
# st 的 fix-keyboard-input 以 CSI u 发送组合键（如 M-S-Enter）
set -s extended-keys on
set -as terminal-features 'st*:extkeys'

# prefix：Alt+Space（解除默认 C-b）
unbind C-b
set -g prefix M-Space

# Alt + Enter 垂直切分；Alt + Shift + Enter 水平切分
bind -n M-Enter split-window -h
bind -n M-S-Enter split-window -v

# Alt + h/j/k/l 切换面板；Alt + H/J/K/L 调整大小
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Alt + Shift + n 新建窗口；Alt + , / . 切换窗口
bind -n M-N new-window
bind -n M-, previous-window
bind -n M-. next-window

# 备用：prefix 后（SSH 等 Alt 失效时用）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind , previous-window
bind . next-window
bind N new-window

## Plugin ##
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# 主题（https://github.com/catppuccin/tmux）
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "no"

# 自定义图标（须在 catppuccin.tmux 加载前；两侧 thin space U+2009）
set -g @catppuccin_application_icon " 󰘵 "
set -g @catppuccin_date_time_icon "  "
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M:%S"

# 插件目录固定在用户配置下（与仓库分离）
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-interval 1
set -g status-right-length 120
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# fcitx5：有 fcitx5-remote 时才启用键盘状态模块
if-shell 'command -v fcitx5-remote >/dev/null 2>&1' {
  set -g @fcitx_im ' En'
  source -F "#{d:current_file}/fcitx.conf"
  set -ag status-right "#{E:@catppuccin_status_fcitx}"
  run-shell -b "#{d:current_file}/fcitx-watch.sh"
}

# 初始化 TPM（必须放在配置文件最底部）
run '~/.config/tmux/plugins/tpm/tpm'
