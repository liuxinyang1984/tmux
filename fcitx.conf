# vim:set ft=tmux:
# fcitx5：键盘图标；按住 prefix 时变红
%hidden MODULE_NAME="fcitx"

set -gq "@catppuccin_${MODULE_NAME}_icon" " 󰥻 "
# 不要用 -F，保留 client_prefix 条件以便实时变色
set -gq "@catppuccin_${MODULE_NAME}_color" "#{?client_prefix,#{E:@thm_red},#{E:@thm_lavender}}"
set -gq "@catppuccin_${MODULE_NAME}_text" "#{@fcitx_im}"

# 强制用上面的 color 重建 icon_bg（避免旧值残留）
set -gu "@catppuccin_status_${MODULE_NAME}_icon_bg"
set -gu "@catppuccin_status_${MODULE_NAME}"

# 插件始终在 ~/.config/tmux/plugins（不在仓库里）
source -F "~/.config/tmux/plugins/tmux/utils/status_module.conf"
